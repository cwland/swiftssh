# The volume keeps its name `sync-data` (Compose stores it as `<project>_sync-data`, e.g.
# `server_sync-data`), so a server that ran as "termius-sync" keeps its data after the rename.
services:
  swiftssh-sync:
    container_name: swiftssh-sync
    build:
      context: ..
      dockerfile: Server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SYNC_API_KEYS: ${SYNC_API_KEYS:?set SYNC_API_KEYS (comma-separated)}
      DATABASE_PATH: /data/sync.sqlite
    volumes:
      - sync-data:/data
    restart: unless-stopped

volumes:
  sync-data:
