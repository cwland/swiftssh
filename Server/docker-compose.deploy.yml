# Deploy from the prebuilt GHCR image (no build). Usage:
#   docker login ghcr.io -u cwland        # PAT with read:packages (repo is private)
#   echo 'SYNC_API_KEYS=key1,key2' > .env
#   docker compose -f docker-compose.deploy.yml up -d
services:
  termius-sync:
    image: ghcr.io/cwland/termius-reimagined-sync:${SYNC_IMAGE_TAG:-latest}
    ports:
      # Published on all interfaces because the reverse proxy may run on another host.
      # If your proxy runs on the same host, publish only to localhost: "127.0.0.1:8080:8080".
      - "8080:8080"
    environment:
      SYNC_API_KEYS: ${SYNC_API_KEYS:?set SYNC_API_KEYS (comma-separated)}
      DATABASE_PATH: /data/sync.sqlite
    volumes:
      - sync-data:/data
    healthcheck:
      # curl is installed in the runtime image.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  sync-data:
