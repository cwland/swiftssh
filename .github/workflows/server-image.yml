name: server-image

on:
  push:
    branches: [main]
    paths:
      - "Server/**"
      - "Packages/CoreSSH/**"
      - ".github/workflows/server-image.yml"
    tags: ["server-v*"]
  workflow_dispatch:

# Default to read-only; the publish job asks for packages: write itself.
permissions:
  contents: read

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/termius-reimagined-sync

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4

      # Swift 6.0 on Linux: libswiftObservation.so references swift::threading::fatal, which
      # isn't exported, so test binaries that use Observation (AppCore) fail to link. The flag
      # is passed here only (never in a manifest); the server image doesn't use Observation.
      - name: Test CoreSSH
        working-directory: Packages/CoreSSH
        run: swift test -Xlinker --allow-shlib-undefined

      - name: Test Server
        working-directory: Server
        run: swift test

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
