name: ios

# Compile check for SwiftSSH on iPhone and iPad (branch "ios"): builds the CoreSSH and SwiftSSHUI
# packages for the iOS Simulator and, once App-iOS/project.yml exists, the iOS app itself
# (unsigned). The "archive" job makes the TestFlight archive as ios-release.yml does (Release, for
# devices, ad hoc signed) but doesn't sign or upload it. The "mac" job compiles the Mac app
# (unsigned, Debug), so every push proves both apps still build. Nothing is uploaded or released;
# TestFlight uploads are ios-release.yml, on "ios-v*" tags.
#
# Package versions: Packages/CoreSSH/Package.resolved pins the package build; the iOS app uses a
# copy of App/Package.resolved, so both apps build the same package versions.

on:
  push:
    branches: [ios]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # -e and pipefail: a failing command in a pipeline fails the step.
    shell: bash

jobs:
  build:
    # Xcode 27 image (arm64), as in release.yml.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Tools
        run: |
          brew install xcodegen
          xcodebuild -version
          swift --version

      - name: Build CoreSSH for iOS
        run: |
          cd Packages/CoreSSH
          log="$RUNNER_TEMP/coressh-ios.log"
          xcodebuild -scheme CoreSSH-Package -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation -derivedDataPath "$RUNNER_TEMP/dd-core" build > "$log" 2>&1 || {
              grep -E "error:|BUILD FAILED|The following build commands failed" "$log" | sort -u | head -80
              echo "::error::CoreSSH iOS build failed (full log in the ios-build-logs artifact)"
              exit 1
            }
          grep -E "BUILD SUCCEEDED" "$log"

      - name: Build SwiftSSHUI for iOS
        if: hashFiles('Packages/SwiftSSHUI/Package.swift') != ''
        run: |
          cd Packages/SwiftSSHUI
          # Same remote package versions as CoreSSH (SwiftSSHUI's only remote packages come through it).
          cp ../CoreSSH/Package.resolved Package.resolved
          log="$RUNNER_TEMP/swiftsshui-ios.log"
          xcodebuild -scheme SwiftSSHUI -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation -derivedDataPath "$RUNNER_TEMP/dd-ui" build > "$log" 2>&1 || {
              grep -E "error:|BUILD FAILED|The following build commands failed" "$log" | sort -u | head -80
              echo "::error::SwiftSSHUI iOS build failed (full log in the ios-build-logs artifact)"
              exit 1
            }
          grep -E "BUILD SUCCEEDED" "$log"

      - name: Build the iOS app
        if: hashFiles('App-iOS/project.yml') != ''
        run: |
          cd App-iOS
          xcodegen generate
          project=$(ls -d *.xcodeproj | head -1)
          scheme="${project%.xcodeproj}"
          resolved_dir="$project/project.xcworkspace/xcshareddata/swiftpm"
          # Pinned exactly as ios-release.yml pins the TestFlight build, so a push proves it resolves.
          mkdir -p "$resolved_dir"
          cp ../App/Package.resolved "$resolved_dir/"
          log="$RUNNER_TEMP/app-ios.log"
          xcodebuild -project "$project" -scheme "$scheme" -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation \
            -onlyUsePackageVersionsFromResolvedFile \
            -derivedDataPath "$RUNNER_TEMP/dd-app" CODE_SIGNING_ALLOWED=NO build > "$log" 2>&1 || {
              grep -E "error:|BUILD FAILED|The following build commands failed" "$log" | sort -u | head -80
              echo "::error::iOS app build failed (full log in the ios-build-logs artifact)"
              exit 1
            }
          grep -E "BUILD SUCCEEDED" "$log"

      - name: Upload the build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore

  archive:
    # The TestFlight archive exactly as ios-release.yml makes it (Release, for devices, ad hoc
    # signed, packages pinned), without the signing and upload that need the App Store Connect key.
    # Catches device-only and optimizer-only compile problems before a tag is pushed.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Tools
        run: |
          brew install xcodegen
          xcodebuild -version

      - name: Archive the iOS app
        run: |
          cd App-iOS
          xcodegen generate
          project=SwiftSSHMobile.xcodeproj
          resolved_dir="$project/project.xcworkspace/xcshareddata/swiftpm"
          mkdir -p "$resolved_dir"
          cp ../App/Package.resolved "$resolved_dir/"
          archive="$RUNNER_TEMP/SwiftSSHMobile.xcarchive"
          log="$RUNNER_TEMP/archive.log"
          xcodebuild -project "$project" -scheme SwiftSSHMobile -configuration Release \
            -destination 'generic/platform=iOS' -skipPackagePluginValidation \
            -onlyUsePackageVersionsFromResolvedFile -derivedDataPath "$RUNNER_TEMP/dd-archive" \
            -archivePath "$archive" \
            CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM=7C54KH5NDL \
            CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive > "$log" 2>&1 || {
              grep -E "error:|ARCHIVE FAILED|The following build commands failed" "$log" | sort -u | head -80 || true
              echo "::error::iOS archive failed (full log in the ios-archive-log artifact)"
              exit 1
            }
          grep -E "ARCHIVE SUCCEEDED" "$log"
          plist="$archive/Products/Applications/SwiftSSH.app/Info.plist"
          for key in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion ITSAppUsesNonExemptEncryption; do
            echo "$key: $(/usr/libexec/PlistBuddy -c "Print :$key" "$plist")"
          done
          [ "$(/usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$plist")" = false ]

      - name: Upload the archive log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive-log
          path: ${{ runner.temp }}/archive.log
          if-no-files-found: ignore

  mac:
    # The Mac app, built as release.yml builds it (App/Package.resolved pins every package), but in
    # Debug and without signing: only a compile check.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Tools
        run: |
          brew install xcodegen
          xcodebuild -version

      - name: Build the Mac app
        run: |
          cd App
          xcodegen generate
          resolved_dir=SwiftSSH.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          mkdir -p "$resolved_dir"
          cp Package.resolved "$resolved_dir/"
          log="$RUNNER_TEMP/app-mac.log"
          xcodebuild -project SwiftSSH.xcodeproj -scheme SwiftSSH -configuration Debug \
            -destination 'generic/platform=macOS' -skipPackagePluginValidation \
            -onlyUsePackageVersionsFromResolvedFile -derivedDataPath "$RUNNER_TEMP/dd-mac" \
            CODE_SIGNING_ALLOWED=NO build > "$log" 2>&1 || {
              grep -E "error:|BUILD FAILED|The following build commands failed" "$log" | sort -u | head -80
              echo "::error::Mac app build failed (full log in the mac-build-log artifact)"
              exit 1
            }
          grep -E "BUILD SUCCEEDED" "$log"

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-build-log
          path: ${{ runner.temp }}/app-mac.log
          if-no-files-found: ignore
