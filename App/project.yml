name: TermiusReimagined

options:
  bundleIdPrefix: com.cwland
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  CoreSSH:
    path: ../Packages/CoreSSH
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    minorVersion: 1.99.3

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO

targets:
  TermiusReimagined:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: TermiusReimagined
        PRODUCT_BUNDLE_IDENTIFIER: com.cwland.TermiusReimagined
        GENERATE_INFOPLIST_FILE: YES
        # Fragment merged with the generated Info.plist (carries NSAppTransportSecurity only).
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Termius Reimagined"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        MARKETING_VERSION: "0.6.1"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Stamp git commit
        basedOnDependencyAnalysis: false
        script: |
          plist="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          commit=$(git -C "${SRCROOT}/.." rev-parse --short HEAD 2>/dev/null || echo unknown)
          /usr/libexec/PlistBuddy -c "Delete :TRGitCommit" "$plist" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c "Add :TRGitCommit string ${commit}" "$plist"
    dependencies:
      - package: CoreSSH
        product: AppCore
      - package: CoreSSH
        product: CoreModels
      - package: CoreSSH
        product: SyncCore
      - package: CoreSSH
        product: SSHCore
      - package: SwiftTerm
        product: SwiftTerm

  TermiusReimaginedTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cwland.TermiusReimaginedTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TermiusReimagined.app/Contents/MacOS/TermiusReimagined"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: TermiusReimagined

schemes:
  TermiusReimagined:
    build:
      targets:
        TermiusReimagined: all
        TermiusReimaginedTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TermiusReimaginedTests
    archive:
      config: Release
