name: SwiftSSH

options:
  bundleIdPrefix: com.cwland
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  CoreSSH:
    path: ../Packages/CoreSSH
  # Shared look (theme tokens, cards, badges) with the iPhone/iPad app.
  SwiftSSHUI:
    path: ../Packages/SwiftSSHUI
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    minorVersion: 1.99.3

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO

targets:
  SwiftSSH:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: SwiftSSH
        PRODUCT_BUNDLE_IDENTIFIER: com.cwland.SwiftSSH
        GENERATE_INFOPLIST_FILE: YES
        # Fragment merged with the generated Info.plist (carries NSAppTransportSecurity only).
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "SwiftSSH"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        MARKETING_VERSION: "1.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Stamp git commit
        basedOnDependencyAnalysis: false
        script: |
          plist="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          commit=$(git -C "${SRCROOT}/.." rev-parse --short HEAD 2>/dev/null || echo unknown)
          /usr/libexec/PlistBuddy -c "Delete :SwiftSSHGitCommit" "$plist" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c "Add :SwiftSSHGitCommit string ${commit}" "$plist"
    dependencies:
      - package: CoreSSH
        product: AppCore
      - package: CoreSSH
        product: CoreModels
      - package: CoreSSH
        product: SyncCore
      - package: CoreSSH
        product: SSHCore
      - package: SwiftSSHUI
        product: SwiftSSHUI
      - package: SwiftTerm
        product: SwiftTerm

  SwiftSSHTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cwland.SwiftSSHTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SwiftSSH.app/Contents/MacOS/SwiftSSH"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: SwiftSSH

schemes:
  SwiftSSH:
    build:
      targets:
        SwiftSSH: all
        SwiftSSHTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SwiftSSHTests
    archive:
      config: Release
